name: Site CI

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site-ci.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site-ci.yml"]

defaults:
  run:
    working-directory: site

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup reads packageManager from the repo-root
          # package.json by default, not respecting this job's
          # `defaults.run.working-directory` -- the root package.json is an
          # npm project (only site/ uses pnpm), so this must be pointed at
          # site/package.json explicitly.
          package_json_file: site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup reads packageManager from the repo-root
          # package.json by default, not respecting this job's
          # `defaults.run.working-directory` -- the root package.json is an
          # npm project (only site/ uses pnpm), so this must be pointed at
          # site/package.json explicitly.
          package_json_file: site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Route/layout types (e.g. LayoutProps) are ambient globals Next.js
      # generates on demand -- `next typegen` (or a full build/dev run)
      # must happen before `tsc` can see them.
      - name: Check types
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup reads packageManager from the repo-root
          # package.json by default, not respecting this job's
          # `defaults.run.working-directory` -- the root package.json is an
          # npm project (only site/ uses pnpm), so this must be pointed at
          # site/package.json explicitly.
          package_json_file: site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No secrets needed: TYPESAFE_API_KEY is schema-optional (src/env.ts)
      # so a build without it still succeeds -- /api/suggest just falls
      # back to "unconfigured" at request time. The one live network call
      # during build (getRepoStars(), for the static homepage's star count)
      # already fails soft to null on any error, including a rate limit.
      - name: Build
        run: pnpm build
