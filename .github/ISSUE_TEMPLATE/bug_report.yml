name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Exact steps, including what you typed and what history entries were around at the time, if relevant.
      placeholder: |
        1. `HISTFILE` has `git status` and `git stash list`
        2. Typed `git st`
        3. Expected a suggestion, got nothing
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - TypeSafe (direct)
        - Cloudflare Workers AI
        - Not sure / not provider-related
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: guesswork commit/version
      description: Output of `git -C ~/.zsh/guesswork rev-parse --short HEAD` (or wherever you installed it)
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: zsh version (`zsh --version`), Node version (`node -v`), OS
      placeholder: |
        zsh 5.9, node v22.11.0, macOS 15
    validations:
      required: true

  - type: textarea
    id: debug-log
    attributes:
      label: Debug log
      description: |
        If the suggestion itself is wrong or missing, a `GUESSWORK_DEBUG_LOG` capture is the single most useful thing you can attach.
        Set `export GUESSWORK_DEBUG_LOG=/tmp/guesswork-debug.log` above the `source` line in `.zshrc`, `exec zsh`, reproduce, then paste the relevant lines here.
      render: text
    validations:
      required: false
